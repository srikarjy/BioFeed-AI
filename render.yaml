databases:
  - name: biofeed-ai-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: biofeed-ai
    runtime: image
    image:
      url: ghcr.io/srikarjy/biofeed-ai/backend:latest
      # GHCR package stays private; Render needs a Registry Credential
      # (Account Settings -> Registry Credentials) named exactly this,
      # created once from a GitHub PAT with `read:packages` scope. See
      # README's "Live deployment" section for the one-time setup.
      creds: biofeed-ai-ghcr
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biofeed-ai-db
          property: connectionString
      - key: EMBEDDING_BACKEND
        value: hash
      - key: LLM_ENABLED
        value: "false"
      - key: AUTH_JWT_SECRET
        generateValue: true
